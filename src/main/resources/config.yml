#The NewJoinMessage plugin is a custom plugin designed for Bukkit/Spigot servers. It allows players to set their own join and leave messages, providing a personalized touch to the server experience.
#1.8 - 1.20.6 ✔



about:
  - "NewJoinMessage Plugin"
  - "Version: 6.0.0"
  - "Author: [Yanel, oled]"

# Check Spigot for a newer version on startup. Online admins holding
# joinleave.update are told when one is available. Set to false to disable
# the check and the notifications entirely.
update-check: true


#Permissions: joinleave.reload; or reload command , joinleave.set.join; for set join command message , joinleave.set.leave; for set leave message



# MySQL Configuration
mysql:
  enabled: false
  host: localhost
  port: 3306
  database: your_database
  username: your_username
  password: your_password
  # Table holding every per-player setting. Created and migrated automatically,
  # so an older 5.1.1 install gains the new columns on first start.
  table: player_messages


# Join and leave messages

#Join/Leave Prefix
join-prefix: "&d[&a+&d]"
leave-prefix: "&7[&c-&7]"

#default Join/leave message
default-join-prefix: "&7PLAYERNAME &5has joined"
default-leave-prefix: "&4PLAYERNAME has left"


#default Join/Leave Message by Player (PLAYERNAME has joined/left - Welcome!/Goodbye)
default-join-message: "&dWelcome!"
default-leave-message: "&cGoodbye!"


# Configuration file for New Player Welcome

# Enable/disable the welcome message
welcome-message-enabled: false

# Customize the welcome message
welcome-message: "&e&l[!] &7Welcome %player% to the server! You are the %count% player!"

# Modern-style appearance (used when present; & codes or #RRGGBB)
join-text: "joined the server"
leave-text: "left the server"
player-name-color: "&a"
join-text-color: "&f"
leave-text-color: "&f"
use-modern-format: false

# Keep ModernJoinMessage's player-friendly behavior. When false, players need
# the matching joinleave.set.* permission.
allow-all-players: true

# Optional icon shown before the player name. Players can override it with
# /njm icon <icon>, or remove it with /njm icon off.
default-icon: ""

# Sounds accept comma-separated aliases so one config works across old and new
# Bukkit enum names. Set enabled to false to keep joins/leaves silent.
sounds:
  enabled: false
  join: "ENTITY_PLAYER_LEVELUP,LEVEL_UP"
  leave: "BLOCK_NOTE_BLOCK_BASS,NOTE_BASS"
  volume: 1.0
  pitch: 1.0

# Optional pools. A random entry is used only when a player has no custom
# message. Leave empty to use default-join-message/default-leave-message.
default-join-messages: []
default-leave-messages: []

# No join/leave broadcast is sent while a player is in one of these worlds.
disabled-worlds: []

# Available in messages: %player%, %displayname%, %world%, %online%,
# %max_players%, %player_count%, %server_name%, %motd%, %server_version%,
# %time%, %prefix%, %vault_prefix%, plus the legacy PLAYERNAME token.
#
# LuckPerms: %luckperms_prefix%, %luckperms_suffix%, %luckperms_group%
# Essentials: %essentials_nickname%, %essentials_displayname%, %essentials_vanished%, %essentials_afk%
# Citizens: %citizens_is_npc%, %citizens_npc_name%
# WorldGuard: %worldguard_regions%, %worldguard_region%
# Multiverse: %multiverse_world%, %multiverse_world_alias%, %multiverse_world_colored%
# DiscordSRV: %discordsrv_verified%
# PlaceholderAPI: All PlaceholderAPI placeholders (e.g. %player_health%, %server_tps%)
# MVdWPlaceholderAPI: All MVdWPlaceholderAPI placeholders
# MiniMessage: Full MiniMessage syntax support (e.g. <red>text</red>, <gradient:blue:green>text</gradient>)

# Longest custom message a player may set, in characters. Stops oversized chat
# spam. Set to 0 for no limit.
max-message-length: 100

# Seconds a player must wait between message changes. Set to 0 to disable.
# Players holding joinleave.cooldown.bypass never wait.
change-cooldown-seconds: 3

# Value used for %server_name%. Leave empty to fall back to the server's own name.
server-name: ""

# Players listed per /njm list page.
list-page-size: 8

# DiscordSRV Integration
discordsrv:
  enabled: false
  join-message: "🟢 %player% joined the server"
  leave-message: "🔴 %player% left the server"

# HolographicDisplays Integration
holographicdisplays:
  enabled: false
  join-duration-seconds: 3
  leave-duration-seconds: 3
  height-offset: 2.5

# ProtocolLib Integration (for advanced packet features)
protocollib:
  enabled: false
  use-packets-for-messages: false

# WorldGuard Integration
worldguard:
  enabled: false
  # List of region names where join/leave messages are disabled
  disabled-regions: []
  # List of region names where join/leave messages are forced
  forced-regions: []
