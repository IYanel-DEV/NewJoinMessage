name: NewJoinMessage
version: '${project.version}'
main: com.joinleave.JoinleaveMessage
authors: [Yanel, oled]
description: Custom join/leave messages per player for Minecraft 1.8 through latest
website: https://www.spigotmc.org/resources/110979/
softdepend: [SuperVanish, PremiumVanish, VanishNoPacket, PlaceholderAPI, LuckPerms, Essentials, Citizens, ProtocolLib, WorldGuard, Multiverse-Core, DiscordSRV, HolographicDisplays, MVdWPlaceholderAPI]

commands:
  njm:
    description: NewJoinMessage main command
    usage: /njm [help|set|clear|gui|preview|toggle|icon|sound|reload|setplayer|info|language]
    aliases: [modernjoinmessage, mjm, newjoinmessage]

permissions:
  joinleave.*:
    description: All NewJoinMessage permissions
    default: op
    children:
      joinleave.admin: true
      joinleave.set.join: true
      joinleave.set.leave: true
      joinleave.reload: true
      joinleave.gui: true
      joinleave.setplayer: true
      joinleave.clearplayer: true
      joinleave.info: true
      joinleave.update: true
      joinleave.sound: true
      joinleave.icon: true
      joinleave.preview: true
      joinleave.toggle: true
      joinleave.list: true
      joinleave.cooldown.bypass: true
  joinleave.admin:
    description: Admin GUI and all management actions
    default: op
    children:
      joinleave.set.join: true
      joinleave.set.leave: true
      joinleave.reload: true
      joinleave.gui: true
      joinleave.setplayer: true
      joinleave.clearplayer: true
      joinleave.info: true
      joinleave.sound: true
      joinleave.icon: true
      joinleave.preview: true
      joinleave.toggle: true
  joinleave.set.join:
    description: Allows players to set their join message.
    default: op
  joinleave.set.leave:
    description: Allows players to set their leave message.
    default: op
  joinleave.reload:
    description: Allows players to reload the plugin.
    default: op
  joinleave.gui:
    description: Allows players to open the GUI.
    default: op
  joinleave.setplayer:
    description: Allows setting join/leave messages for another player.
    default: op
  joinleave.clearplayer:
    description: Allows clearing join/leave messages for another player.
    default: op
  joinleave.info:
    description: Allows viewing player information.
    default: op
  joinleave.update:
    description: Check for update.
    default: op
  joinleave.sound:
    description: Choose personal join and leave sounds.
    default: true
  joinleave.icon:
    description: Choose a personal icon.
    default: true
  joinleave.preview:
    description: Preview personal join and leave messages.
    default: true
  joinleave.toggle:
    description: Toggle personal join and leave broadcasts.
    default: true
  joinleave.list:
    description: List every player who has a custom join or leave message.
    default: op
  joinleave.cooldown.bypass:
    description: Skip the wait between message changes.
    default: op
  modernjoinmessage.use:
    description: Alias permission for ModernJoinMessage users.
    default: true
  modernjoinmessage.admin:
    description: Alias admin permission (opens admin GUI)
    default: op
  modernjoinmessage.reload:
    description: Alias reload permission for ModernJoinMessage users.
    default: op
  modernjoinmessage.sound.*:
    description: Alias permission for personal sounds.
    default: true
